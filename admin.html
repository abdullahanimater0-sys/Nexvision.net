<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexvision — Admin</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <header>
    <a class="logo" href="index.html">NEX<span>VISION</span></a>
    <div class="admin-head-actions">
      <a class="btn ghost" href="index.html">View website</a>
      <button class="btn ghost" id="logout-btn" type="button">Log out</button>
    </div>
  </header>

  <main class="admin-shell">
    <section id="login-panel" class="admin-login panel">
      <p class="eyebrow">PRIVATE AREA</p>
      <h1>Admin <em>Login</em></h1>
      <p class="lead">Sign in to manage Nexvision client orders.</p>
      <form id="login-form" class="contact-form">
        <input id="admin-email" type="email" placeholder="Admin email" autocomplete="username" required>
        <input id="admin-password" type="password" placeholder="Password" autocomplete="current-password" required>
        <button class="btn primary" type="submit">Login ↗</button>
        <p id="login-msg" class="form-message"></p>
      </form>
    </section>

    <section id="dashboard-panel" class="dashboard hidden">
      <div class="dashboard-title-row">
        <div>
          <p class="eyebrow">NEXVISION ADMIN</p>
          <h1>Orders <em>Dashboard</em></h1>
          <p class="lead">Review incoming inquiries and update their progress.</p>
        </div>
        <button id="refresh-orders" class="btn ghost" type="button">Refresh</button>
      </div>

      <div class="order-stats">
        <article class="stat-card"><span>Total</span><strong id="count-total">0</strong></article>
        <article class="stat-card"><span>New</span><strong id="count-new">0</strong></article>
        <article class="stat-card"><span>In Progress</span><strong id="count-progress">0</strong></article>
        <article class="stat-card"><span>Completed</span><strong id="count-complete">0</strong></article>
      </div>

      <div class="orders-toolbar">
        <input id="order-search" type="search" placeholder="Search name, email, WhatsApp or service…">
        <select id="status-filter">
          <option value="all">All statuses</option>
          <option value="New">New</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Closed">Closed</option>
        </select>
      </div>

      <div id="orders-list" class="orders-list"></div>
      <p id="orders-msg" class="form-message"></p>
    </section>
  </main>

  <template id="order-template">
    <article class="order-card">
      <div class="order-top">
        <div>
          <span class="order-id"></span>
          <h3 class="order-name"></h3>
        </div>
        <span class="status-badge"></span>
      </div>
      <div class="order-meta">
        <span class="order-service"></span>
        <span class="order-budget"></span>
        <span class="order-date"></span>
      </div>
      <div class="order-contact"></div>
      <p class="order-requirements"></p>
      <div class="order-actions">
        <a class="btn ghost order-whatsapp" target="_blank" rel="noopener">WhatsApp</a>
        <select class="order-status" aria-label="Order status">
          <option value="New">New</option>
          <option value="In Progress">In Progress</option>
          <option value="Completed">Completed</option>
          <option value="Closed">Closed</option>
        </select>
        <button class="btn ghost order-delete" type="button">Delete</button>
      </div>
    </article>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
